
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoCrud2 using async await </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header">
                        <h4 id="todoHeader">Todo Form </h4>
                    </div>
                    <div class="card-body">
                        <form action="" id="todoForm">
                            <div class="form-group">
                                <label for="todoItem">Enter your Todo Item</label>
                                <input type="text" id="todoItem" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="todoDescription">Enter your Todo Description</label>
                                <textarea name="" id="todoDescription" class="form-control" required></textarea>
                            </div>

                            <div>
                                <label for="isCompleted">IsCompleted</label>
                                <select name="" id="isCompleted" class="form-control">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary btn-block mt-3" id="addTodoBtn">Add
                                Todo</button>
                            <button type="button" class="btn btn-info btn-block d-none" id="updateTodoBtn">Update
                                Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card">
                    <div class="card-body">

                        <ul id="todoContainer">
                            <!-- <li class="list-group-item" onclick="toggleDescription(this)">
                                <div class="d-flex justify-content-between">
                                    <div>
                                        <input type="checkbox" onclick="event.stopPropagation();onCheck(this)">
                                        <strong>HTML</strong>
                                    </div>
                                    <div>
                                        <button onclick="event.stopPropagation();onTodoEdit(this)"
                                            class="btn btn-info btn-sm">Edit</button>
                                        <button onclick="event.stopPropagation();onTodoRemove(this)"
                                            class="btn btn-sm btn-danger">Remove</button>
                                    </div>
                                </div>

                                <div class="collapse">
                                    <div class="card-body">
                                        Learn HTML
                                    </div>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
